name: AWS ECR Pipeline

on:
  push:
    branches: [AWS-Infrastructure]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 873014949275.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPO: my-app

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          VERSION="1.0.$PATCH"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:${{ steps.version.outputs.version }}"
          docker build -t "$IMAGE" -t "$ECR_REGISTRY/$ECR_REPO:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPO:latest"

      - name: Deploy and verify
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPO:${{ steps.version.outputs.version }}"
          docker rmi "$IMAGE" || true
          docker run --rm "$IMAGE"
