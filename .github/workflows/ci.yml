name: CI Pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          VERSION="1.0.$PATCH"
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        
        - name: Show version from output
        run: echo "Version read back: ${{ steps.version.outputs.version }}"
